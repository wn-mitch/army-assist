<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>40k Army Assist</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <div id="error-container" style="display: none;">
      By the Emperor! There's been an error. Click the button below to clear the session storage.
      <button id="clear-session-storage">Clear Session Storage</button>
    </div>
    <script>
      window.addEventListener('load', function() {
        const root = document.getElementById('root');
        if (!root || root.innerHTML.trim() === '') {
          const errorContainer = document.getElementById('error-container');
          errorContainer.style.display = 'hidden';
        }
      });

      document.getElementById('clear-session-storage').addEventListener('click', function() {
        localStorage.clear();
        alert('Local storage cleared. Please reload the page.');
      });
    </script>
  </body>
</html>
